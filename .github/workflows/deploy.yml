name: Build and deploy

# Downloads the latest Translink SEQ GTFS feed, rebuilds the map data and
# publishes site/ to GitHub Pages. Run it by hand from the Actions tab
# (workflow_dispatch), or by pushing to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  FEED_URL: https://gtfsrt.api.translink.com.au/GTFS/SEQ_GTFS.zip
  DEPOTS: ""  # empty = every depot in depots/, in config order, plus "All"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test
        run: python -m pytest -q tests

      - name: Download GTFS feed
        run: |
          curl -fsSL --retry 3 --retry-delay 15 -o SEQ_GTFS.zip "$FEED_URL"
          ls -l SEQ_GTFS.zip
          unzip -q SEQ_GTFS.zip -d gtfs
          # The zip may hold the files at its root or inside a folder.
          GTFS_DIR=$(dirname "$(find gtfs -name routes.txt | head -n 1)")
          echo "GTFS_DIR=$GTFS_DIR" >> "$GITHUB_ENV"
          cat "$GTFS_DIR/feed_info.txt"

      - name: Build site data
        run: python -m busrads build --gtfs "$GTFS_DIR" ${DEPOTS:+--depot $DEPOTS}

      - name: Version the page's assets
        # Pages lets browsers cache files for 10 minutes; stamping the script and stylesheet
        # URLs with the commit makes a new deploy load its own JS and CSS, not cached ones.
        # (Data files are versioned by the build id in index.json.)
        run: |
          V=${GITHUB_SHA::8}
          sed -i "s#css/app.css#css/app.css?v=$V#; s#js/app.js#js/app.js?v=$V#" site/index.html
          grep -n "?v=" site/index.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
