<title>Toowong Route Territories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/*LEAFLETCSS*/
/* Layout: full-bleed map; a control panel docks right on desktop and becomes a bottom sheet on phones. Hue family encodes the hundreds digit: cool = 3xx north-west, warm = 4xx west, slate = inner-city links. */
:root{
  --bg:#eef0ee; --ground:#e3e7e4; --panel:#fbfcfb; --fg:#1d2422; --muted:#5d6a66; --line:#cfd6d2;
  --road:#b9c2be; --rail:#8a9490; --river:#9ec3d6; --label:#4a5653; --focus:#1d5bd8;
  --g19x:#66727f; --g30x:#94877a;
  --g34x:#3a5fc2; --g36x:#138fa3; --g37x:#3c9446; --g38x:#7a4bc2; --g39x:#86a01f;
  --g40x:#c2306b; --g41x:#d6402a; --g42x:#e2790f; --g43x:#b48a06; --g44x:#8e3a1c; --g47x:#cf5fa3;
  --shared:#8d9692; --cbd:#a9b1ad;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141917; --ground:#1a201e; --panel:#1c2321; --fg:#e7ece9; --muted:#9aa8a3; --line:#2f3a37;
  --road:#3b4744; --rail:#5b6965; --river:#2c4f63; --label:#a8b5b0; --focus:#7aa7ff;
  --g19x:#94a1ae; --g30x:#b8aa9b;
  --g34x:#6f93f0; --g36x:#3bc0d3; --g37x:#5fc46a; --g38x:#a684ef; --g39x:#b2cc45;
  --g40x:#f0609a; --g41x:#ff6f55; --g42x:#ffa040; --g43x:#e2b737; --g44x:#d06a45; --g47x:#f08fca;
  --shared:#6f7a76; --cbd:#56605c; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141917; --ground:#1a201e; --panel:#1c2321; --fg:#e7ece9; --muted:#9aa8a3; --line:#2f3a37;
  --road:#3b4744; --rail:#5b6965; --river:#2c4f63; --label:#a8b5b0; --focus:#7aa7ff;
  --g19x:#94a1ae; --g30x:#b8aa9b;
  --g34x:#6f93f0; --g36x:#3bc0d3; --g37x:#5fc46a; --g38x:#a684ef; --g39x:#b2cc45;
  --g40x:#f0609a; --g41x:#ff6f55; --g42x:#ffa040; --g43x:#e2b737; --g44x:#d06a45; --g47x:#f08fca;
  --shared:#6f7a76; --cbd:#56605c; color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;overflow:hidden}
.app{position:relative;height:100%;display:grid;grid-template-columns:1fr 360px}
#map{height:100%;background:var(--ground)}
.leaflet-container{background:var(--ground);font-family:var(--body)}
.panel{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0}
.head{padding:16px 16px 12px;border-bottom:1px solid var(--line);display:grid;gap:6px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;margin:0;letter-spacing:.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;line-height:1.45;margin:0}
.seg{display:flex;gap:4px;padding:3px;background:var(--ground);border-radius:8px;margin-top:6px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:600 13px var(--body);padding:7px 4px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.toggles{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.toggles label{display:flex;align-items:center;gap:6px;cursor:pointer}
.list{overflow-y:auto;padding:4px 0 16px;flex:1;min-height:0}
.fam{padding:14px 16px 4px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.row{display:grid;gap:5px;padding:6px 0 9px}
.row:hover,.row.on{background:var(--ground)}
.grp{display:grid;grid-template-columns:14px 52px 1fr auto;gap:10px;align-items:center;padding:2px 16px;cursor:pointer;border:0;background:none;width:100%;text-align:left;color:inherit;font:inherit}
.grp:focus-visible,.chip:focus-visible,.seg button:focus-visible,.hub-btn:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.sw{width:14px;height:14px;border-radius:3px}
.pfx{font-family:var(--display);font-weight:700;font-size:22px;line-height:1}
.desc{min-width:0;display:grid;gap:3px}
.area{min-width:0;font-size:12.5px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;flex-wrap:wrap;gap:4px;padding:0 16px 0 102px}
.chip{font-family:var(--display);font-weight:600;font-size:14px;line-height:1;padding:3px 6px;border-radius:4px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.chip:hover,.chip[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--panel)}
.leaflet-tooltip.ztip,.leaflet-tooltip.rtip{background:var(--panel);color:var(--fg);border:1px solid var(--line);font:500 12.5px var(--body);box-shadow:0 2px 8px rgba(0,0,0,.18);padding:4px 8px}
.ztip b,.rtip b{font-family:var(--display);font-weight:700;font-size:17px;margin-right:4px}
.leaflet-tooltip.ztip::before{display:none}
.ztip .m{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px}
.leaflet-tooltip.ztip{white-space:normal;width:max-content;max-width:280px}
.sn{font-weight:600;font-size:13px;line-height:1.3}
.tchips{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
.tchip{font:600 13px/1 var(--display);color:var(--panel);background:var(--c);padding:3px 5px;border-radius:3px;border:0;cursor:pointer}
.tchip small{font:500 10px var(--mono);margin-left:3px;opacity:.85}
.tchip.on{outline:2px solid var(--fg);outline-offset:1px}
.leaflet-tooltip-top.rtip::before{border-top-color:var(--panel)}
.num{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.num b{display:block;color:var(--fg);font-weight:500;font-size:13px}
.hubcard{margin:12px 16px 0;padding:12px;border:1px solid var(--line);border-radius:8px;display:grid;gap:8px}
.hub-btn{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hub-btn strong{font-family:var(--display);font-size:19px;font-weight:700}
.bars{display:grid;gap:5px}
.bar{display:grid;grid-template-columns:34px 1fr 36px;gap:8px;align-items:center;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.bar i{display:block;height:8px;border-radius:2px}
.foot{padding:10px 16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);line-height:1.45}
.sheet-tab{display:none}
.lbl{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--label);white-space:nowrap;text-shadow:0 0 3px var(--ground),0 0 3px var(--ground),0 0 6px var(--ground);pointer-events:none}
.leaflet-tooltip.lbl-wrap{background:none;border:0;box-shadow:none;padding:0}
.leaflet-tooltip.lbl-wrap::before{display:none}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--fg);box-shadow:0 3px 14px rgba(0,0,0,.25)}
.leaflet-popup-content{margin:10px 12px;font-size:13px;line-height:1.4}
.pp h3{margin:0 0 4px;font-family:var(--display);font-size:18px;font-weight:700}
.pp .m{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.leaflet-bar a{background:var(--panel);color:var(--fg);border-bottom-color:var(--line)}
.leaflet-control-attribution{background:var(--panel)!important;color:var(--muted)!important;font-size:10px}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:1fr}
  .panel{position:absolute;left:0;right:0;bottom:0;height:46%;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;z-index:1000;box-shadow:0 -4px 18px rgba(0,0,0,.15);padding-bottom:env(safe-area-inset-bottom,0px);transition:height .25s}
  .panel.min{height:132px}
  .sheet-tab{display:block;width:100%;border:0;background:none;padding:8px 0 0;cursor:pointer}
  .sheet-tab span{display:block;margin:auto;width:40px;height:4px;border-radius:2px;background:var(--line)}
  .head{padding-top:6px}
  h1{font-size:24px}
  .sub{display:none}
}
@media (prefers-reduced-motion:reduce){.panel{transition:none}}
</style>
<div class="app">
  <div id="map" role="application" aria-label="Map of Toowong depot route territories"></div>
  <aside class="panel" id="panel">
    <button class="sheet-tab" id="sheetTab" aria-label="Expand or collapse panel"><span></span></button>
    <div class="head">
      <div class="eyebrow">BCC · Toowong depot · weekday</div>
      <h1>Route-number territories</h1>
      <p class="sub">Each stop is coloured by the prefix group that runs most of its weekday trips. Stops shared between groups are grey. City stops and UQ are left out so the zones show where routes start.</p>
      <div class="seg" role="group" aria-label="Map view">
        <button id="vZones" aria-pressed="true">Zones</button>
        <button id="vRoutes" aria-pressed="false">Routes</button>
        <button id="vBoth" aria-pressed="false">Both</button>
      </div>
      <div class="toggles">
        <label><input type="checkbox" id="tSpokes" checked> UQ spokes</label>
        <label><input type="checkbox" id="tShared" checked> Shared corridors</label>
        <label><input type="checkbox" id="tLabels" checked> Suburbs</label>
      </div>
    </div>
    <div class="list" id="list"></div>
    <div class="foot" id="foot"></div>
  </aside>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script id="d-base" type="application/json">/*BASE*/</script>
<script id="d-zones" type="application/json">/*ZONES*/</script>
<script id="d-cells" type="application/json">/*CELLS*/</script>
<script id="d-rbuf" type="application/json">/*RBUF*/</script>
<script id="d-gbuf" type="application/json">/*GBUF*/</script>
<script id="d-routes" type="application/json">/*ROUTES*/</script>
<script id="d-stops" type="application/json">/*STOPS*/</script>
<script id="d-meta" type="application/json">/*META*/</script>
<script>
(function(){
const J=id=>JSON.parse(document.getElementById(id).textContent);
const rbuf=J('d-rbuf'),gbuf=J('d-gbuf'),cells=J('d-cells'),base=J('d-base'),zones=J('d-zones'),routes=J('d-routes'),stops=J('d-stops'),meta=J('d-meta');
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const col=g=>css('--g'+g)||'#888';
const FAM={'19x':'inner','30x':'inner','34x':'nw','36x':'nw','37x':'nw','38x':'nw','39x':'nw','40x':'w','41x':'w','42x':'w','43x':'w','44x':'w','47x':'w'};
const AREA={'19x':'West End – Teneriffe ferry link','30x':'RBWH – Teneriffe','34x':'Stafford, Grange, Gordon Park','36x':'Brookside, Everton Park, Herston','37x':'Ashgrove & Bardon','38x':'The Gap','39x':'Mitchelton','40x':'Toowong – UQ shuttle (shares 41x/47x stops)','41x':'UQ, Taringa, Indooroopilly, Long Pocket','42x':'Chapel Hill','43x':'Kenmore South, Fig Tree Pocket, Brookfield','44x':'Moggill, Kenmore, Fig Tree Pocket','47x':'Toowong, Rainworth, Mt Coot-tha'};
const map=L.map('map',{zoomControl:true,preferCanvas:true,attributionControl:true,zoomSnap:.25,zoomDelta:.5});
const ZB=L.geoJSON(zones).getBounds();
map.fitBounds(ZB,{padding:[16,16]});
map.attributionControl.setPrefix(false).addAttribution('Data: Translink SEQ GTFS (CC BY 4.0)');
const R=L.canvas({padding:.3});
let L_base,L_zone,L_shared,L_route,L_stops,L_spokes,L_labels,L_hub;
let focus=null,view='zones';
function draw(){
  [L_base,L_zone,L_shared,L_fp,L_route,L_stops,L_spokes,L_labels,L_hub,L_hl].forEach(l=>l&&map.removeLayer(l));L_hl=null;L_fp=null;
  L_base=L.layerGroup([
    L.geoJSON(base.river,{renderer:R,interactive:false,style:{color:css('--river'),weight:7,opacity:1}}),
    L.geoJSON(base.roads,{renderer:R,interactive:false,style:{color:css('--road'),weight:1.1,opacity:.9}}),
    L.geoJSON(base.rail,{renderer:R,interactive:false,style:{color:css('--rail'),weight:1.6,opacity:.9,dashArray:'5 3'}})
  ]).addTo(map);
  const dim=g=>focus&&g!==focus;
  const SH=f=>['shared','cbd'].includes(f.properties.cls);
  L_shared=L.layerGroup([
    L.geoJSON(cells,{renderer:R,interactive:false,filter:SH,style:f=>({stroke:false,fillColor:css(f.properties.cls==='cbd'?'--cbd':'--shared'),fillOpacity:f.properties.cls==='cbd'?.18:.34})}),
    L.geoJSON(zones,{renderer:R,interactive:false,filter:SH,style:{color:css('--shared'),weight:1.6,dashArray:'4 3',fill:false,opacity:.9}})
  ]);
  L_fp=focus?L.geoJSON(gbuf,{renderer:R,interactive:false,filter:f=>f.properties.group===focus,style:f=>({stroke:false,fillColor:col(focus),fillOpacity:f.properties.kind==='main'?.28:.14})}):null;
  L_zone=L.geoJSON(zones,{renderer:R,interactive:false,filter:f=>FAM[f.properties.cls],
    style:f=>{const g=f.properties.cls;return{color:col(g),weight:dim(g)?.5:1.4,fillColor:col(g),fillOpacity:dim(g)?.06:(view==='both'?.28:.45),opacity:dim(g)?.2:.9}}});
  L_route=L.geoJSON(routes,{renderer:R,filter:f=>f.properties.main,
    style:f=>{const g=f.properties.group;return{color:col(g),weight:dim(g)?1:(view==='routes'?3:2.2),opacity:dim(g)?.12:.9}},
    onEachFeature:(f,l)=>{const p=f.properties;l.bindPopup(`<div class="pp"><h3>${p.route_short_name}</h3>${p.name}<div class="m">${p.trips} weekday trips · ${p.group}</div></div>`)}});
  if(view!=='routes'&&document.getElementById('tShared').checked) L_shared.addTo(map);
  if(L_fp) L_fp.addTo(map);
  if(view!=='routes') L_zone.addTo(map);
  if(view!=='zones') L_route.addTo(map);
  L_stops=L.geoJSON(stops,{renderer:R,pointToLayer:(f,ll)=>{const c=f.properties.cls;const k=FAM[c]?col(c):css(c==='hub'?'--g40x':'--shared');
      return L.circleMarker(ll,{radius:2.6,color:k,weight:1,fillColor:k,fillOpacity:.9,opacity:(FAM[c]&&dim(c))?.15:.9})},
    onEachFeature:(f,l)=>l.bindPopup(()=>stopHTML(f.properties,true))});
  if(map.getZoom()>=14) L_stops.addTo(map);
  // UQ hub + spokes
  const h=meta.hubs[0];
  L_spokes=L.layerGroup(meta.groups.filter(g=>h.groups[g.group]).map(g=>{
    const v=h.groups[g.group];return L.polyline([[g.cy,g.cx],[h.lat,h.lon]],{renderer:R,color:col(g.group),weight:2+Math.sqrt(v)*0.7,opacity:dim(g.group)?.12:.75,lineCap:'round'})
      .bindPopup(`<div class="pp"><h3>${g.group} → UQ</h3>${v} weekday stop visits at Chancellors Place</div>`)}));
  if(document.getElementById('tSpokes').checked) L_spokes.addTo(map);
  L_hub=L.circleMarker([h.lat,h.lon],{renderer:R,radius:9,color:css('--panel'),weight:3,fillColor:css('--fg'),fillOpacity:1})
    .bindPopup(`<div class="pp"><h3>${h.name}</h3>Routes ${h.routes.join(', ')}<div class="m">${Object.values(h.groups).reduce((a,b)=>a+b,0)} weekday stop visits</div></div>`).addTo(map);
  L_labels=L.layerGroup(PLACES.map(([n,la,lo])=>L.marker([la,lo],{opacity:0,interactive:false,icon:L.divIcon({className:'',iconSize:[0,0]})}).bindTooltip(n,{permanent:true,direction:'center',className:'lbl-wrap',opacity:1}).on('add',function(){const t=this.getTooltip();t&&t.getElement()&&t.getElement().classList.add('lbl')})));
  if(document.getElementById('tLabels').checked&&map.getZoom()>=12) L_labels.addTo(map);
  applyHL();
}
let L_hl=null,L_fp=null,pinned=null,hover=null;
// Zone hover labels: our own hit test on each mouse move, independent of the canvas hover state.
const ztip=L.tooltip({className:'ztip',direction:'right',offset:[14,0],interactive:false});
function hitIn(group,lp){let hit=null;group&&group.eachLayer(l=>{if(!hit&&l._pxBounds&&l._pxBounds.contains(lp)&&l._containsPoint(lp))hit=l});return hit}
function hitZone(ll){const lp=map.latLngToLayerPoint(ll);
  if(L_zone&&map.hasLayer(L_zone)){const h=hitIn(L_zone,lp);if(h)return{zone:h.feature.properties.cls}}
  if(L_shared&&map.hasLayer(L_shared)){const h=hitIn(L_shared.getLayers()[0],lp);if(h)return{cell:h.feature.properties}}
  return null}
function hitStop(ll){const lp=map.latLngToLayerPoint(ll);let best=null,bd=9;
  for(const g of [L_rs,L_stops]){if(!g||!map.hasLayer(g))continue;g.eachLayer(l=>{if(!l._point)return;const d=l._point.distanceTo(lp);if(d<bd){bd=d;best=l}});if(best)break}
  return best?best.feature.properties:null}
const RG={};meta.groups.forEach(g=>g.routes.forEach(r=>RG[r]=g.group));
function stopHTML(p,click){
  const chips=p.rc.split(' ').filter(Boolean).map(x=>{const [r,n]=x.split(':');return `<${click?'button':'span'} class="tchip${click?' pchip':''}${(pinned||hover)===r?' on':''}" data-r="${r}" style="--c:var(--g${RG[r]})">${r}<small>${n}</small></${click?'button':'span'}>`}).join('');
  return `<div class="sn">${p.stop_name}</div><div class="tchips">${chips}</div>`+(p.other?`<div class="m">Other routes: ${p.other}</div>`:'')+`<div class="m">Serviced ${Math.round(p.ntrips)} times each weekday by these routes${click?' · tap a route to highlight it':''}</div>`}
let hovPending=false,lastMove=null;
map.on('mousemove',e=>{lastMove=e.latlng;if(hovPending)return;hovPending=true;requestAnimationFrame(()=>{hovPending=false;
  let h=null,sp=null;try{sp=hitStop(lastMove);if(!sp)h=hitZone(lastMove)}catch(err){h=null}
  const c=map.getContainer();
  if(sp){ztip.setLatLng(lastMove).setContent(stopHTML(sp,false));if(!map.hasLayer(ztip))ztip.addTo(map);c.style.cursor='pointer';return}
  if(!h){if(map.hasLayer(ztip))map.removeLayer(ztip);c.style.cursor='';return}
  let html;
  if(h.zone){html=`<b>${h.zone}</b>${AREA[h.zone]||''}`;c.style.cursor='pointer'}
  else{const p=h.cell;html=(p.cls==='cbd'?'<b>City</b>all groups pass through':`<b>Shared</b>${p.g.split(' ').map(x=>x.replace(':',' ')+'%').join(' · ')}`)+`<div class="m">Routes ${p.r}</div>`;c.style.cursor=''}
  ztip.setLatLng(lastMove).setContent(html);if(!map.hasLayer(ztip))ztip.addTo(map)})});
map.on('mouseout',()=>{if(map.hasLayer(ztip))map.removeLayer(ztip)});
map.on('click',e=>{if(map._popup&&map.hasLayer(map._popup))return;let h=null;try{h=hitZone(e.latlng)}catch(err){}if(h&&h.zone)setFocus(h.zone)});
function footprint(test,c,o){return L.geoJSON(cells,{renderer:R,interactive:false,filter:test,style:{stroke:false,fillColor:c,fillOpacity:o}})}
let L_rs=null;
function syncStops(){if(!L_stops)return;const show=!(pinned||hover)&&map.getZoom()>=14;show?L_stops.addTo(map):map.removeLayer(L_stops)}
function pinRoute(r){hover=null;pinned=(pinned===r)?null:r;document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x.dataset.r===pinned));map.closePopup();applyHL();if(pinned)hlBounds(pinned);else if(focus)groupBounds(focus);else goHome()}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('.pchip');if(b)pinRoute(b.dataset.r)},true);
function applyHL(){
  if(L_hl){map.removeLayer(L_hl);L_hl=null}
  if(L_rs){map.removeLayer(L_rs);L_rs=null}
  if(L_zone)L_zone.resetStyle(); if(L_route)L_route.resetStyle();
  syncStops();
  const r=pinned||hover; if(!r)return;
  const feats=routes.features.filter(f=>f.properties.route_short_name===r); if(!feats.length)return;
  const p=feats[0].properties, fc={type:'FeatureCollection',features:feats};
  L_zone&&L_zone.setStyle({fillOpacity:.08,opacity:.25}); L_route&&L_route.setStyle({opacity:.12});
  let best=[];feats.filter(f=>f.properties.main).forEach(f=>{const c=f.geometry.type==='LineString'?f.geometry.coordinates:f.geometry.coordinates.flat(1);if(c.length>best.length)best=c});
  const mid=best[Math.floor(best.length/2)];
  L_hl=L.layerGroup([
    L.geoJSON(rbuf,{renderer:R,interactive:false,filter:f=>f.properties.route===r,style:f=>({stroke:false,fillColor:col(p.group),fillOpacity:f.properties.kind==='main'?.42:.18})}),
    L.geoJSON(fc,{renderer:R,interactive:false,style:f=>({color:css('--panel'),weight:f.properties.main?9:6,opacity:1,lineCap:'round',lineJoin:'round'})}),
    L.geoJSON(fc,{renderer:R,style:f=>({color:col(p.group),weight:f.properties.main?5:3,dashArray:f.properties.main?null:'6 5',opacity:1,lineCap:'round',lineJoin:'round'}),onEachFeature:(f,l)=>l.bindPopup(`<div class="pp"><h3>${r}${f.properties.main?'':' · variant'}</h3>${p.name}<div class="m">${f.properties.main?p.trips+' weekday trips':f.properties.n+' weekday trips use this path'} · ${p.group}</div></div>`)}),
    L.tooltip({permanent:true,direction:'top',className:'rtip',offset:[0,-6]}).setLatLng([mid[1],mid[0]]).setContent(`<b>${r}</b>${p.name}`)
  ]).addTo(map);
  // only the stops this route actually serves
  L_rs=L.geoJSON(stops,{renderer:R,filter:f=>(' '+f.properties.rc).includes(' '+r+':'),
    pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:3.6,color:css('--panel'),weight:1.5,fillColor:col(p.group),fillOpacity:1}),
    onEachFeature:(f,l)=>l.bindPopup(()=>stopHTML(f.properties,true))}).addTo(map);
}
